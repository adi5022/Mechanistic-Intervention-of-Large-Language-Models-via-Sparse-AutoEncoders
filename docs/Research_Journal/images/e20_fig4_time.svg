<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 300' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Time breakdown</title><rect width='760' height='300' fill='#ffffff'/><text x='380.0' y='28' font-size='15' fill='#1f2937' text-anchor='middle' font-weight='bold'>Figure 4. Where the time went (seconds)</text><text x='240' y='92' font-size='12' fill='#1f2937' text-anchor='end' font-weight='normal'>Candidate ranking + safety filter</text><rect x='250' y='70' width='3.0' height='34' fill='#2563eb'/><text x='261' y='92' font-size='12' fill='#1f2937' text-anchor='start' font-weight='bold'>0.84s</text><text x='240' y='152' font-size='12' fill='#1f2937' text-anchor='end' font-weight='normal'>Sweep (34 steps, 102 passes)</text><rect x='250' y='130' width='21.7' height='34' fill='#ea580c'/><text x='279.65955882352944' y='152' font-size='12' fill='#1f2937' text-anchor='start' font-weight='bold'>9.82s</text><text x='240' y='212' font-size='12' fill='#1f2937' text-anchor='end' font-weight='normal'>Total wall clock (whole run on screen)</text><rect x='250' y='190' width='449.9' height='34' fill='#9ca3af'/><text x='707.9426470588235' y='212' font-size='12' fill='#1f2937' text-anchor='start' font-weight='bold'>203.97s</text><text x='250' y='262' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal'>Model work is ~10.8 s; the other ~193 s is outside the model (network lookups, page rendering).</text></svg>