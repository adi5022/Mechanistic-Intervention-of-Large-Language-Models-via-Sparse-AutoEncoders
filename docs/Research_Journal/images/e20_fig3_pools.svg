<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 300' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Candidate pool sizes</title><rect width='760' height='300' fill='#ffffff'/><text x='380.0' y='28' font-size='15' fill='#1f2937' text-anchor='middle' font-weight='bold'>Figure 3. Round 0 candidate pools: 120 features, each safe on one side only</text><text x='180' y='102' font-size='12' fill='#1f2937' text-anchor='end' font-weight='normal'>Mute side (65 safe / 55 rejected)</text><rect x='190' y='80' width='265.0' height='34' fill='#16a34a'/><rect x='455.0' y='80' width='224.2' height='34' fill='#9ca3af'/><text x='322.5' y='102' font-size='12' fill='#ffffff' text-anchor='middle' font-weight='bold'>safe 65</text><text x='567.1153846153846' y='102' font-size='12' fill='#ffffff' text-anchor='middle' font-weight='bold'>rejected 55</text><text x='180' y='182' font-size='12' fill='#1f2937' text-anchor='end' font-weight='normal'>Boost side (55 safe / 62 rejected)</text><rect x='190' y='160' width='224.2' height='34' fill='#16a34a'/><rect x='414.2' y='160' width='252.8' height='34' fill='#9ca3af'/><text x='302.11538461538464' y='182' font-size='12' fill='#ffffff' text-anchor='middle' font-weight='bold'>safe 55</text><text x='540.6153846153846' y='182' font-size='12' fill='#ffffff' text-anchor='middle' font-weight='bold'>rejected 62</text><text x='190' y='250' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal'>62 of 65 safe mutes were rejected as boosts; all 55 safe boosts were rejected as mutes; 3 overlaps went to the mute side.</text></svg>