<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 340' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Headline comparison</title><rect width='900' height='340' fill='#ffffff'/><text x='450.0' y='28' font-size='15' fill='#1f2937' text-anchor='middle' font-weight='bold'>Figure 8. Headline comparison on 13 valid prompts</text><text x='60' y='70' font-size='13' fill='#6b7280' text-anchor='start' font-weight='normal'>A. Reached rank #1</text><text x='150' y='114' font-size='12' fill='#1f2937' text-anchor='end' font-weight='normal'>All positions</text><rect x='160' y='90' width='320' height='34' fill='#e5e7eb'/><rect x='160' y='90' width='246.2' height='34' fill='#2563eb'/><text x='414.1538461538462' y='113' font-size='13' fill='#1f2937' text-anchor='start' font-weight='bold'>10/13 (77%)</text><text x='150' y='174' font-size='12' fill='#1f2937' text-anchor='end' font-weight='normal'>Last token</text><rect x='160' y='150' width='320' height='34' fill='#e5e7eb'/><rect x='160' y='150' width='98.5' height='34' fill='#ea580c'/><text x='266.46153846153845' y='173' font-size='13' fill='#1f2937' text-anchor='start' font-weight='bold'>4/13 (31%)</text><text x='560' y='70' font-size='13' fill='#6b7280' text-anchor='start' font-weight='normal'>B. Head-to-head result per prompt</text><rect x='560' y='90' width='207.7' height='44' fill='#2563eb'/><text x='663.8461538461538' y='117' font-size='12' fill='#ffffff' text-anchor='middle' font-weight='bold'>All wins: 9</text><rect x='767.6923076923076' y='90' width='92.3' height='44' fill='#9ca3af'/><text x='813.8461538461538' y='117' font-size='12' fill='#ffffff' text-anchor='middle' font-weight='bold'>Tie: 4</text><text x='560' y='160' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal'>Last-token won 0 of 13 prompts.</text><text x='60' y='240' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal'>Ties = both modes reached rank #1 (Seiyu, Marie Curie, Obama, CEO of Tesla).</text><text x='60' y='258' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal'>All-positions win = it ended at a better rank, or reached rank #1 when last-token did not.</text><text x='60' y='276' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal'>Sign test on the 9 non-tied prompts (9 for all-positions, 0 against): two-sided p = 0.004.</text><text x='60' y='294' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal'>Excluded: 3 controls already at rank #1, and 'chopsticks' (2 tokens).</text></svg>